# robot-system 主配置（随 DEB 装入 /opt/robot-system/config/，并登记为 conffile，见架构文档 §5.5）
#
# rsctl 与常驻服务共用这一个文件，各自只读取自己关心的字段，未声明的字段会被忽略。
# 本文件是可选：删除或缺失时两侧都使用同样的默认值（下面写出的取值即默认值），
# 因此这里的每一行都可以按需修改或整行删掉。

# --- rsctl：受管变更与统一 target ---
# 应用级变更锁的等待超时（秒）。该锁只能约束遵守它的 rsctl 进程（见架构文档 §4.6）。
lock_timeout_secs = 60
# 业务服务统一组织的 target。受管服务由该 target 的依赖关系确定（见架构文档 §4.1）。
managed_target = "robot-system.target"

# --- 常驻服务：采集与保留策略（见架构文档 §4.3、§5.4）---
# 进程与资源采集周期（秒）。
sample_interval_secs = 5
# 每次日志巡检回溯的时间窗口（秒）。
journal_lookback_secs = 300
# 资源指标保留天数（建议 7~30 天）。
metrics_retention_days = 30
# 普通运行实例历史保留天数。
runs_retention_days = 90
# 运行类错误事件保留天数（建议不少于 180 天）。
events_retention_days = 180

# --- 常驻服务：HTTP 请求任务入口（占位，见架构文档 §10）---
# 当前仅占位：启用后所有请求返回 501 Not Implemented，不执行任何变更。
http_enabled = false
http_listen = "127.0.0.1:8790"
